<!DOCTYPE html>
<html>
<head>
    <title>Test Chat API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Chat API</h1>
    
    <div class="test-section">
        <h3>0. Test Basic Servlet</h3>
        <button onclick="testBasic()">Test GET /Itel/test</button>
        <div id="basicResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>1. Test GET Request</h3>
        <button onclick="testGet()">Test GET /Itel/api/chat-ai</button>
        <div id="getResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. Test POST Request</h3>
        <input type="text" id="questionInput" placeholder="Nhập câu hỏi..." value="Xin chào">
        <button onclick="testPost()">Test POST /Itel/api/chat-ai</button>
        <div id="postResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. Test với câu hỏi đơn giản</h3>
        <button onclick="testSimple()">Test: "Hello"</button>
        <div id="simpleResult" class="result"></div>
    </div>

    <script>
        async function testBasic() {
            const resultDiv = document.getElementById('basicResult');
            resultDiv.textContent = 'Đang test...';
            
            try {
                const response = await fetch('/Itel/test', {
                    method: 'GET'
                });
                
                const data = await response.text();
                resultDiv.textContent = `Status: ${response.status}\nResponse: ${data}`;
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        async function testGet() {
            const resultDiv = document.getElementById('getResult');
            resultDiv.textContent = 'Đang test...';
            
            try {
                const response = await fetch('/Itel/api/chat-ai', {
                    method: 'GET'
                });
                
                const data = await response.text();
                resultDiv.textContent = `Status: ${response.status}\nResponse: ${data}`;
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        async function testPost() {
            const resultDiv = document.getElementById('postResult');
            const question = document.getElementById('questionInput').value;
            
            resultDiv.textContent = 'Đang test...';
            
            try {
                const response = await fetch('/Itel/api/chat-ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.text();
                resultDiv.textContent = `Status: ${response.status}\nResponse: ${data}`;
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        async function testSimple() {
            const resultDiv = document.getElementById('simpleResult');
            resultDiv.textContent = 'Đang test...';
            
            try {
                const response = await fetch('/Itel/api/chat-ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: 'Hello' })
                });
                
                const data = await response.text();
                resultDiv.textContent = `Status: ${response.status}\nResponse: ${data}`;
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
